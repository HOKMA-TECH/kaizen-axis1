# Axis production Nginx — security headers (CSP Report-Only + baseline)
# Include from the app vhost in IMOBKAIZEN-PLATFORM.
# Turnstile requires challenges.cloudflare.com in script/frame/connect.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://api-app.imobkaizen.com.br https://challenges.cloudflare.com wss://api-app.imobkaizen.com.br; worker-src 'self' blob:; manifest-src 'self'" always;
add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
